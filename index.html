<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoomNite</title>
<style>
  :root {
    --bg: #0d0d12;
    --panel: #15151d;
    --panel2: #1c1c26;
    --line: #2a2a38;
    --text: #e8e8f0;
    --dim: #9a9aae;
    --faint: #6b6b80;
    --accent: #d9463f;      /* Doom red */
    --accent2: #f0a020;     /* amber */
    --ok: #4caf7d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* subtle vignette so it doesn't read as flat grey */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% -20%, #1e1e2c 0%, transparent 60%);
  }
  header {
    position: relative; z-index: 1;
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #14141c, #0f0f16);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: 26px; letter-spacing: 4px; font-weight: 700;
    color: var(--accent); text-shadow: 0 0 18px rgba(217,70,63,.45);
  }
  .sub { color: var(--faint); font-size: 12px; }
  .spacer { flex: 1; }
  input[type=search] {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: var(--radius); font-size: 14px; width: 260px;
    font-family: inherit;
  }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .bar { padding: 10px 24px; border-bottom: 1px solid var(--line);
         display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         position: relative; z-index: 1; background: #101017; }
  button.chip {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12px;
    font-family: inherit; transition: .12s;
  }
  button.chip:hover { color: var(--text); border-color: #3d3d50; }
  button.chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  main {
    flex: 1; overflow-y: auto; padding: 18px 24px 60px;
    position: relative; z-index: 1;
  }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .12s, transform .12s;
    position: relative;
  }
  .card:hover { border-color: #3f3f55; transform: translateY(-1px); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.missing { opacity: .55; }
  .row { display: flex; align-items: center; gap: 8px; }
  .name { font-weight: 600; font-size: 15px; flex: 1; }
  .num {
    color: var(--faint); font-variant-numeric: tabular-nums;
    font-size: 12px; min-width: 20px;
  }
  .note { color: var(--dim); font-size: 12.5px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .tag {
    font-size: 10.5px; padding: 2px 7px; border-radius: 4px;
    background: #23232f; color: var(--faint); border: 1px solid #2e2e3c;
    font-family: Consolas, monospace;
  }
  .tag.iwad { color: var(--accent2); border-color: #4a3a20; }
  .tag.kind { color: #7fb0d0; border-color: #26384a; }
  .go {
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
    padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
    font-family: inherit; transition: .12s;
  }
  .go:hover { background: #e85750; }
  .go:disabled { background: #3a3a48; color: var(--faint); cursor: not-allowed; }
  .go.busy { background: var(--accent2); color: #221; }
  .cmd {
    font-family: Consolas, monospace; font-size: 11px; color: var(--faint);
    background: #101017; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; word-break: break-all; display: none;
  }
  .cmd.show { display: block; }
  .empty { color: var(--faint); text-align: center; padding: 60px 0; }
  footer {
    position: relative; z-index: 1; border-top: 1px solid var(--line);
    padding: 8px 24px; color: var(--faint); font-size: 11.5px;
    display: flex; gap: 16px; align-items: center;
    background: #0f0f16;
  }
  kbd {
    background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: Consolas, monospace;
    font-size: 11px; color: var(--dim);
  }
  #toast {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel2); border: 1px solid var(--accent); color: var(--text);
    padding: 9px 18px; border-radius: 8px; font-size: 13px; z-index: 50;
    opacity: 0; pointer-events: none; transition: .2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .warn {
    margin: 0 24px 0; padding: 8px 12px; border-radius: 8px;
    background: #3a2020; border: 1px solid #6b3030; color: #f0b0b0; font-size: 12.5px;
  }
</style>
</head>
<body>
<header>
  <h1>DOOMNITE</h1>
  <span class="sub" id="count">loading&hellip;</span>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="Search&hellip;">
</header>

<div class="bar">
  <button class="chip" data-f="all" aria-pressed="true">All</button>
  <button class="chip" data-f="pack">GZDoom mods</button>
  <button class="chip" data-f="standalone">Standalone</button>
  <button class="chip" data-f="doom1">Doom 1 IWAD</button>
  <button class="chip" data-f="combo">Combos</button>
  <button class="chip" data-f="missing">Missing files</button>
</div>

<div id="warn"></div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No matches.</div></main>

<footer>
  <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> select</span>
  <span><kbd>Enter</kbd> launch</span>
  <span><kbd>d</kbd> show command</span>
  <span><kbd>/</kbd> search</span>
  <span class="spacer"></span>
  <span id="packname"></span>
</footer>
<div id="toast"></div>

<script>
let ENTRIES = [], filter = "all", sel = 0, shown = [];

const $ = s => document.querySelector(s);
const grid = $("#grid");

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.borderColor = bad ? "#6b3030" : "var(--ok)";
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function matches(e) {
  if (filter === "pack" && e.kind !== "pack") return false;
  if (filter === "standalone" && e.kind !== "standalone") return false;
  if (filter === "doom1" && e.iwad !== "DOOM.WAD") return false;
  if (filter === "combo" && (e.mods || []).length < 2) return false;
  if (filter === "missing" && e.exists !== false) return false;
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return true;
  return (e.label + " " + (e.note || "") + " " + (e.mods || []).join(" "))
    .toLowerCase().includes(q);
}

function cardHTML(e, i) {
  const tags = [];
  if (e.kind === "pack") {
    tags.push(`<span class="tag kind">GZDoom</span>`);
    tags.push(`<span class="tag iwad">${esc(e.iwad.replace(".WAD", ""))}</span>`);
    if ((e.mods || []).length > 1)
      tags.push(`<span class="tag">${e.mods.length} mods</span>`);
  } else {
    tags.push(`<span class="tag kind">standalone</span>`);
  }
  for (const m of (e.mods || []))
    tags.push(`<span class="tag">${esc(m)}</span>`);
  return `<div class="card ${e.exists === false ? "missing" : ""}" data-i="${i}">
    <div class="row"><span class="num">${i}</span>
      <span class="name">${esc(e.label)}</span>
      <button class="go" data-go="${i}">Play</button></div>
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    <div class="tags">${tags.join("")}</div>
    ${e.exists === false ? `<div class="note" style="color:#e08a8a">files missing</div>` : ""}
    <div class="cmd" id="cmd-${i}"></div>
  </div>`;
}

// Render must end with a valid selection. shown holds INDEXES into ENTRIES, so
// after filtering the old sel may be filtered out; fall back to the first row.
// Resetting to 0 when the set changes is what made Escape feel broken: typing
// a query then clearing it left you on a stale index.
function render(keepSel) {
  shown = [];
  for (let i = 0; i < ENTRIES.length; i++) if (matches(ENTRIES[i])) shown.push(i);
  grid.innerHTML = shown.map(i => cardHTML(ENTRIES[i], i)).join("");
  $("#empty").hidden = shown.length > 0;
  if (!shown.length) sel = 0;
  else if (!keepSel || !shown.includes(sel)) sel = shown[0];
  highlight();
}

function highlight() {
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("sel", Number(c.dataset.i) === sel));
  const c = document.querySelector(`.card[data-i="${sel}"]`);
  if (c) c.scrollIntoView({ block: "nearest" });
}

async function launch(i) {
  const btn = document.querySelector(`[data-go="${i}"]`);
  if (btn) { btn.classList.add("busy"); btn.textContent = "Starting"; btn.disabled = true; }
  try {
    const r = await fetch("/api/launch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index: i })      // integer index only, by design
    });
    const j = await r.json();
    toast(r.ok ? "Launched: " + j.label : "Failed: " + (j.error || "?"), !r.ok);
  } catch (e) {
    toast("Failed: " + e, true);
  }
  if (btn) { btn.classList.remove("busy"); btn.textContent = "Play"; btn.disabled = false; }
}

async function showCmd(i) {
  const el = document.getElementById("cmd-" + i);
  if (!el) return;
  if (el.classList.contains("show")) { el.classList.remove("show"); return; }
  const r = await fetch("/api/dryrun?i=" + i);
  const j = await r.json();
  el.textContent = j.command || j.error;
  el.classList.add("show");
}

grid.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { launch(Number(go.dataset.go)); return; }
  const c = e.target.closest(".card");
  if (c) { sel = Number(c.dataset.i); highlight(); }
});

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

$("#q").addEventListener("keydown", e => {
  // See the Escape note in the document handler: the native search input eats
  // the key, so it has to be intercepted before it gets there.
  if (e.key !== "Escape") return;
  e.preventDefault();
  e.stopPropagation();
  $("#q").value = "";
  render();
  $("#q").blur();
}, true);

$("#q").addEventListener("input", () => render(true));

// The search box may or may not hold focus. Type-to-search only applies when
// it does, and never for the navigation keys, so the shortcuts work from
// anywhere on the page.
const typing = () => document.activeElement === $("#q");
const NAV = new Set(["ArrowUp", "ArrowDown", "Enter", "d", "D", "/"]);

document.addEventListener("keydown", e => {
  if (typing() && !NAV.has(e.key)) return;   // let them type a query
  if (e.key === "/" ) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape") {
    // A native <input type="search"> consumes Escape itself (it clears the
    // field and stops the event here), so a document-level listener never sees
    // it. Listen on the input in the capture phase as well, or Escape silently
    // does nothing but clear the text.
    $("#q").value = "";
    render();
    $("#q").blur();
    e.preventDefault();
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    if (typing()) { $("#q").blur(); return; }   // Enter in search returns to the grid
    if (shown.length) launch(sel);
    return;
  }
  if (e.key.toLowerCase() === "d") { showCmd(sel); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!shown.length) return;
    const at = shown.indexOf(sel);
    sel = shown[Math.max(0, Math.min(shown.length - 1,
      at + (e.key === "ArrowDown" ? 1 : -1)))];
    highlight();
  }
});

fetch("/api/entries").then(r => r.json()).then(d => {
  ENTRIES = d.entries;
  $("#count").textContent = d.entries.length + " entries";
  $("#packname").textContent = d.pack;
  if (d.missing && d.missing.length) {
    $("#warn").innerHTML =
      `<div class="warn">${d.missing.length} source file(s) missing — see ` +
      `tools\\build.py output: ${esc(d.missing.join("; "))}</div>`;
  }
  render();
});
</script>
</body>
</html>
