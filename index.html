<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoomNite</title>
<style>
  /* Palette and proportions follow the user's own Playnite setup (a custom
     theme, not the stock one): near-black chrome, one saturated cyan accent,
     no left sidebar, a dense cover grid on the left, details panel on the
     right. Accent #55CDFF and indigo #455AA3 were measured from the reference
     screenshot rather than guessed. */
  :root {
    --bg: #05080c;
    --chrome: #070a12;
    --panel: #0b0e14;
    --panel2: #121722;
    --line: #151e3d;
    --line2: #23304f;
    --text: #f2f2f2;
    --dim: #b8b8b8;
    --faint: #7c879b;
    --accent: #55cdff;
    --accent-dim: #455aa3;
    --warn: #f97316;
    --radius: 4px;
    --tile-w: 200px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ------------------------------------------------------------ toolbar */
  header {
    height: 60px; flex: 0 0 60px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px;
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 3;
  }
  h1 {
    margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .5px;
    color: var(--text); white-space: nowrap;
  }
  h1 em { font-style: normal; color: var(--accent); }
  #count { color: var(--faint); font-size: 12px; white-space: nowrap; }
  input[type=search] {
    background: var(--panel2); border: 1px solid var(--line2); color: var(--text);
    padding: 7px 11px; border-radius: var(--radius); font-size: 13px;
    width: 250px; font-family: inherit;
  }
  input[type=search]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(85,205,255,.25);
  }
  input[type=search]::-webkit-search-cancel-button { filter: invert(.7); }
  .spacer { flex: 1; }
  button.chip {
    background: transparent; border: 1px solid var(--line2); color: var(--dim);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12px;
    font-family: inherit; transition: .12s; white-space: nowrap;
  }
  button.chip:hover { color: var(--text); border-color: var(--accent-dim); }
  button.chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: #04121c; font-weight: 600;
  }

  /* --------------------------------------------------------- main split */
  .split { flex: 1; display: flex; min-height: 0; position: relative; z-index: 1; }
  .stage { flex: 1; overflow-y: auto; padding: 18px; min-width: 0; position: relative; }
  /* Blurred, dimmed backdrop rather than a flat fill, as in the reference. */
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 70% 50% at 18% 0%, rgba(85,205,255,.10), transparent 70%),
      radial-gradient(ellipse 60% 45% at 85% 100%, rgba(69,90,163,.13), transparent 70%),
      linear-gradient(180deg, #070b12, #04070b);
  }
  .grid {
    position: relative; z-index: 1;
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile-w), 1fr));
  }

  /* -------------------------------------------------------------- tiles */
  .tile {
    position: relative; border-radius: var(--radius); cursor: pointer;
    border: 1px solid var(--line); overflow: hidden;
    transition: border-color .12s, transform .12s;
    background: var(--panel);
  }
  .tile canvas { display: block; width: 100%; height: auto; aspect-ratio: 4/3; }
  /* Real title-screen art. Sources range from 320x240 to 2364x1106 (1.33 to
     2.14), so cover-cropping to a 4:3 tile sliced up to 38% off the sides and
     clipped the QuakinDoom and Bikini Bottom logos outright. Show the whole
     image instead: the bars land on the title screen's own dark edges, so they
     read as part of the art, and no logo is ever cut off. */
  .tile .cover {
    display: block; width: 100%; aspect-ratio: 4/3;
    object-fit: contain; object-position: center;
    background: #05070b;
  }
  /* Title + facts over a gradient, so they stay readable whatever the art is. */
  .tile .cap {
    position: absolute; inset: auto 0 0 0; z-index: 1;
    padding: 26px 8px 6px;
    background: linear-gradient(180deg, transparent, rgba(3,6,11,.86) 55%);
    pointer-events: none;
  }
  .tile .ctitle {
    display: block; font-size: 11px; font-weight: 600; line-height: 1.25;
    color: var(--text); text-shadow: 0 1px 3px rgba(0,0,0,.9);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tile .cmods {
    display: block; font-size: 9px; color: var(--dim); margin-top: 2px;
    font-family: Consolas, monospace; text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }
  .tile:hover { border-color: var(--accent-dim); transform: translateY(-2px); }
  .tile.sel {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 8px 22px rgba(0,0,0,.6);
  }
  .tile.missing { opacity: .5; }
  .empty { color: var(--faint); text-align: center; padding: 70px 0; position: relative; z-index: 1; }

  /* ------------------------------------------------------ details panel */
  aside {
    width: 320px; flex: 0 0 320px;
    background: var(--chrome); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px;
  }
  aside h2 { margin: 0 0 2px; font-size: 16px; font-weight: 700; line-height: 1.3; }
  aside .note { color: var(--dim); font-size: 12.5px; margin: 6px 0 12px; }
  .acts { display: flex; gap: 8px; margin: 14px 0; align-items: center; }
  .thumb { width: 78px; height: 58px; border-radius: 3px; border: 1px solid var(--line2);
          object-fit: cover; background: var(--panel); }
  .go {
    flex: 1; background: var(--accent); color: #04121c; border: 0; cursor: pointer;
    padding: 9px 14px; border-radius: var(--radius); font-size: 13px;
    font-weight: 700; font-family: inherit; transition: .12s;
  }
  .go:hover { background: #7ad9ff; }
  .go:disabled { background: #2a3145; color: var(--faint); cursor: not-allowed; }
  .go.busy { background: var(--warn); color: #1a0d02; }
  .sq {
    width: 38px; height: 36px; background: #2d2d2d; border: 1px solid var(--line2);
    color: var(--dim); border-radius: var(--radius); cursor: pointer;
    font-size: 15px; font-family: inherit;
  }
  .sq:hover { color: var(--text); border-color: var(--accent-dim); }

  .sect {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    padding-bottom: 5px; margin: 14px 0 8px;
    border-bottom: 1px solid var(--accent-dim);
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    user-select: none;
  }
  .sect .caret { color: var(--accent); font-size: 10px; }
  .sect.closed + .body { display: none; }

  /* Label left, value right: the reference's defining detail-row shape. */
  dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 0; align-items: baseline; }
  dt { color: var(--dim); font-size: 12px; white-space: nowrap; }
  dd { margin: 0; font-size: 12px; text-align: right; color: var(--text); word-break: break-word; }
  dd.bad { color: #e08a8a; }

  /* One card per game; a game with several launch configurations gets a choice
     here instead of its own tile. This is the point of the grouping. */
  .cfg {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; margin-bottom: 6px;
    border: 1px solid var(--line2); border-radius: var(--radius); cursor: pointer;
    transition: .12s; background: var(--panel);
  }
  .cfg:hover { border-color: var(--accent-dim); }
  .cfg.on { border-color: var(--accent); background: rgba(85,205,255,.07); }
  .cfg input { margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
  .cfg .lbl { font-size: 12px; flex: 1; }
  .cfg .mods {
    font-size: 10.5px; color: var(--faint); font-family: Consolas, monospace;
    margin-top: 3px; word-break: break-all;
  }
  .tagx {
    display: inline-block; font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
    background: rgba(249,115,22,.14); color: var(--warn);
    border: 1px solid rgba(249,115,22,.35); margin-left: 5px;
  }
  .cmd {
    font-family: Consolas, monospace; font-size: 10.5px; color: var(--faint);
    background: #080b12; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 7px 8px; word-break: break-all; display: none; margin-top: 8px;
  }
  .cmd.show { display: block; }

  /* ------------------------------------------------------------- footer */
  footer {
    flex: 0 0 32px; height: 32px; border-top: 1px solid var(--line);
    padding: 0 18px; color: var(--faint); font-size: 11.5px;
    display: flex; gap: 16px; align-items: center;
    background: #000; position: relative; z-index: 3;
  }
  kbd {
    background: var(--panel2); border: 1px solid var(--line2); border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; font-family: Consolas, monospace;
    font-size: 10.5px; color: var(--dim);
  }
  #toast {
    position: fixed; bottom: 46px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel2); border: 1px solid var(--accent); color: var(--text);
    padding: 9px 18px; border-radius: 6px; font-size: 13px; z-index: 50;
    opacity: 0; pointer-events: none; transition: .2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { border-color: #b0413e; }
  .warn {
    position: relative; z-index: 3; margin: 0;
    padding: 7px 18px; background: #2a1a10; color: #f0b490;
    border-bottom: 1px solid rgba(249,115,22,.35); font-size: 12px;
  }
  @media (max-width: 900px) {
    aside { width: 260px; flex-basis: 260px; }
  }
</style>
</head>
<body>

<header>
  <h1>DOOM<em>NITE</em></h1>
  <span id="count">loading&hellip;</span>
  <input type=search id="q" placeholder="Search&hellip;">
  <span class="spacer"></span>
  <button class="chip" data-f="all" aria-pressed="true">All</button>
  <button class="chip" data-f="doom1">Doom 1 IWAD</button>
  <button class="chip" data-f="combo">Combos</button>
  <button class="chip" data-f="variants">Multi-config</button>
  <button class="chip" data-f="missing">Missing</button>
</header>

<div id="warn"></div>

<div class="split">
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No matches.</div>
  </div>
  <aside id="panel"><div class="empty" style="padding:20px 0">Select a game.</div></aside>
</div>

<footer>
  <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> select</span>
  <span><kbd>Enter</kbd> launch</span>
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> choose config</span>
  <span><kbd>d</kbd> command</span>
  <span><kbd>/</kbd> search</span>
  <span class="spacer"></span>
  <span id="packname"></span>
</footer>
<div id="toast"></div>

<script>
let ENTRIES = [], GROUPS = [], filter = "all", sel = 0, shown = [], cmdOpen = false;

const $ = s => document.querySelector(s);
const grid = $("#grid");

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("bad", !!bad);
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* One GROUPS entry per game, holding every launch configuration it has. Entries
   with no group (standalone games) become single-config groups. */
function groupEntries(entries) {
  const out = [], byKey = new Map();
  for (const e of entries) {
    const key = e.group || ("\u0000" + e.label);
    let g = byKey.get(key);
    // The manifest label carries a "[Doom 1]" / "[Doom 2]" suffix to keep the
    // per-config rows distinct. On a tile that suffix is noise, since the panel
    // states the IWAD for the selected config. Strip it from the tile title.
    const title = e.label.replace(/\s*\[Doom [12]\]$/, "");
    const c = {
      index: e.__i,
      label: e.variant && e.variant !== "default" ? e.variant : "",
      mods: e.mods || [], iwad: e.iwad, exists: e.exists, size: e.size,
      art: e.art || null,
    };
    if (!g) {
      g = { key, label: title, note: e.note, kind: e.kind, cfgs: [c], pick: 0 };
      byKey.set(key, g);
      out.push(g);
    } else if (e.group) {
      g.cfgs.push(c);
    }
  }
  for (const g of out) g.cfgs.sort((a, b) => a.mods.length - b.mods.length);
  return out;
}

const cfg = g => g.cfgs[g.pick];

function matches(g) {
  if (filter === "doom1" && !g.cfgs.some(c => c.iwad === "DOOM.WAD")) return false;
  if (filter === "combo" && !g.cfgs.some(c => c.mods.length > 1)) return false;
  if (filter === "variants" && g.cfgs.length < 2) return false;
  if (filter === "missing" && g.cfgs.every(c => c.exists !== false)) return false;
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return true;
  const hay = [g.label, g.note || "", ...g.cfgs.flatMap(c => c.mods.concat(c.iwad || ""))]
    .join(" ").toLowerCase();
  return hay.includes(q);
}

/* Procedural poster art. The reference UI is a grid of cover art, which this
   pack has none of, so each tile is drawn from the game's own identity: a
   deterministic hue seeded from its name, the title set large, and the current
   mod stack along the bottom. Deterministic, so a tile keeps its colour. */
function drawTile(canvas, g) {
  const dpr = window.devicePixelRatio || 1;
  const W = 240, H = 180;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const c = canvas.getContext("2d");
  c.scale(dpr, dpr);

  let seed = 0;
  for (let i = 0; i < g.label.length; i++) seed = (seed * 31 + g.label.charCodeAt(i)) >>> 0;
  const hue = seed % 360, hue2 = (hue + 40) % 360;

  const bg = c.createLinearGradient(0, 0, W * 0.6, H);
  bg.addColorStop(0, "hsl(" + hue + " 42% 17%)");
  bg.addColorStop(1, "hsl(" + hue2 + " 48% 8%)");
  c.fillStyle = bg; c.fillRect(0, 0, W, H);

  // Faint diagonal banding, so a flat fill has some structure.
  c.save(); c.globalAlpha = 0.06; c.fillStyle = "#fff";
  for (let i = -H; i < W; i += 14) {
    c.beginPath(); c.moveTo(i, 0); c.lineTo(i + 7, 0);
    c.lineTo(i + 7 + H, H); c.lineTo(i + H, H); c.closePath(); c.fill();
  }
  c.restore();

  const gl = c.createRadialGradient(W / 2, H * 0.36, 4, W / 2, H * 0.36, 74);
  gl.addColorStop(0, "hsla(" + hue + " 90% 62% / .30)");
  gl.addColorStop(1, "transparent");
  c.fillStyle = gl; c.fillRect(0, 0, W, H);

  // Wrap the title over up to three lines, shrinking to fit.
  let lines = [g.label];
  c.font = '700 19px "Segoe UI", system-ui, sans-serif';
  if (c.measureText(g.label).width > W - 20) {
    const words = g.label.split(/\s+/);
    lines = []; let cur = "";
    for (const w of words) {
      const t = cur ? cur + " " + w : w;
      if (c.measureText(t).width > W - 20 && cur) { lines.push(cur); cur = w; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    lines = lines.slice(0, 3);
  }
  let size = 19;
  for (let a = 0; a < 8; a++) {
    c.font = '700 ' + size + 'px "Segoe UI", system-ui, sans-serif';
    if (lines.every(l => c.measureText(l).width <= W - 16) || size <= 11) break;
    size -= 1.5;
  }
  const lh = size * 1.18;
  const top = H * 0.42 - ((lines.length - 1) * lh) / 2;
  c.textAlign = "center";
  c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = 6; c.shadowOffsetY = 1;
  lines.forEach((l, i) => { c.fillStyle = "#f2f2f2"; c.fillText(l, W / 2, top + i * lh); });
  c.shadowBlur = 0; c.shadowOffsetY = 0;

  // Mod stack as a dimmed caption along the bottom.
  const cur = cfg(g);
  const mods = cur.mods.slice(0, 2);
  c.font = "9px Consolas, monospace";
  c.fillStyle = "rgba(184,184,184,.75)";
  mods.forEach((m, i) => {
    c.fillText(m.length > 26 ? m.slice(0, 24) + "\u2026" : m, W / 2, H - 20 + i * 11);
  });
  if (cur.mods.length > 2) {
    c.fillStyle = "rgba(249,115,22,.85)";
    c.fillText("+" + (cur.mods.length - 2) + " more", W / 2, H - 20 + mods.length * 11);
  }

  c.strokeStyle = "rgba(255,255,255,.08)"; c.strokeRect(0.5, 0.5, W - 1, H - 1);
}

/* A tile shows the mod's own title screen when it ships one -- real art, made
   by the mod authors, extracted from the WAD/PK3 by tools/extract_art.py.
   Aspect ratios differ wildly (320x200 up to 2364x1106), so cover-crop to the
   tile box and let the caption gradient carry the title. Games without a title
   screen fall back to the generated poster. */
function tileHTML(g, i) {
  const miss = g.cfgs.every(c => c.exists === false) ? " missing" : "";
  const art = cfg(g).art;
  const body = art
    ? '<img class="cover" src="/art/' + encodeURIComponent(art) + '" alt="">'
    : '<canvas data-g="' + i + '"></canvas>';
  return '<div class="tile' + miss + '" data-i="' + i + '">' + body +
         '<div class="cap"><span class="ctitle">' + esc(g.label) + "</span>" +
         '<span class="cmods"></span></div></div>';
}

/* Caption text under the art. Kept in the DOM rather than painted on canvas so
   it works identically for both the image and generated-poster tiles. */
function paintCaption(g, i) {
  const el = grid.querySelector('.tile[data-i="' + i + '"] .cmods');
  if (!el) return;
  const cur = cfg(g);
  const bits = [];
  if (cur.mods.length) bits.push(cur.mods.length + (cur.mods.length > 1 ? " mods" : " mod"));
  if (cur.iwad) bits.push(cur.iwad.replace(".WAD", ""));
  if (cur.mods.length > 1) bits.push("+" + (cur.mods.length - 1) + " optional");
  el.textContent = bits.join("  \u00b7  ");
}

function render(keepSel) {
  shown = [];
  for (let i = 0; i < GROUPS.length; i++) if (matches(GROUPS[i])) shown.push(i);
  grid.innerHTML = shown.map(i => tileHTML(GROUPS[i], i)).join("");
  $("#empty").hidden = shown.length > 0;
  shown.forEach(paintTile);
  if (!shown.length) sel = 0;
  else if (!keepSel || !shown.includes(sel)) sel = shown[0];
  highlight();
}

/* Draw the generated poster only when the tile has no real art. An <img> that
   fails to load swaps itself to the poster, so a missing art file degrades to
   the same fallback rather than a broken-image icon. */
function paintTile(i) {
  paintCaption(GROUPS[i], i);
  if (cfg(GROUPS[i]).art) return;
  const cv = grid.querySelector('canvas[data-g="' + i + '"]');
  if (cv) drawTile(cv, GROUPS[i]);
}

function panelHTML(g) {
  const cur = cfg(g);
  const multi = g.cfgs.length > 1;
  const kb = n => (n / 1024 / 1024).toFixed(1) + " MB";
  let h = "<h2>" + esc(g.label) + "</h2>" +
          (g.note ? '<div class="note">' + esc(g.note) + "</div>" : "") +
          '<div class="acts"><canvas class="thumb" id="pthumb"></canvas>' +
          '<button class="go" id="pgo">' + (multi ? "Play selected" : "Play") + "</button>" +
          '<button class="sq" id="pcmd" title="Show command (d)">\u2261</button></div>';

  if (multi) {
    h += '<div class="sect" data-tog="1">Configuration <span class="caret">\u25be</span></div><div class="body">';
    g.cfgs.forEach((c, n) => {
      const tag = c.label ? '<span class="tagx">' + esc(c.label) + "</span>" : "";
      h += '<label class="cfg' + (n === g.pick ? " on" : "") + '" data-cfg="' + n + '">' +
           '<input type="radio" name="cfg"' + (n === g.pick ? " checked" : "") + ">" +
           '<span class="lbl">' + esc(c.iwad ? c.iwad.replace(".WAD", "") : "standalone") + tag +
           '<span class="mods">' + esc(c.mods.join(" + ") || "\u2014") + "</span></span></label>";
    });
    h += "</div>";
  }

  h += '<div class="sect" data-tog="1">Details <span class="caret">\u25be</span></div><div class="body">' +
       "<dl>" +
       "<dt>Engine</dt><dd>" + (g.kind === "pack" ? "UZDoom" : "\u2014") + "</dd>" +
       "<dt>IWAD</dt><dd>" + esc(cur.iwad ? cur.iwad.replace(".WAD", "") : "\u2014") + "</dd>" +
       "<dt>Mods</dt><dd>" + cur.mods.length + "</dd>" +
       "<dt>Configs</dt><dd>" + g.cfgs.length + "</dd>" +
       (cur.size ? "<dt>Launcher</dt><dd>" + kb(cur.size) + "</dd>" : "") +
       "<dt>Status</dt><dd" + (cur.exists === false ? ' class="bad"' : "") + ">" +
       (cur.exists === false ? "files missing" : "ready") + "</dd>" +
       '</dl><div class="cmd" id="pcmdout"></div></div>';
  return h;
}

function renderPanel() {
  const g = GROUPS[sel];
  if (!g) {
    $("#panel").innerHTML = '<div class="empty" style="padding:20px 0">Select a game.</div>';
    return;
  }
  $("#panel").innerHTML = panelHTML(g);
  const t = $("#pthumb");
  if (t) {
    const art = cfg(g).art;
    if (art) {
      // Reuse the tile's <img> rather than redrawing into a canvas.
      t.replaceWith(Object.assign(new Image(), {
        className: "thumb", id: "pthumb", alt: "",
        src: "/art/" + encodeURIComponent(art),
      }));
    } else {
      const dpr = window.devicePixelRatio || 1;
      t.width = 78 * dpr; t.height = 58 * dpr;
      const c = t.getContext("2d"); c.scale(dpr, dpr);
      const src = grid.querySelector('canvas[data-g="' + sel + '"]');
      if (src) c.drawImage(src, 0, 0, 78, 58);
    }
  }
  const go = $("#pgo");
  if (go) {
    go.disabled = cfg(g).exists === false;
    go.onclick = () => launch(sel);
  }
  const cb = $("#pcmd");
  if (cb) cb.onclick = () => showCmd();
  $("#panel").querySelectorAll(".sect[data-tog]").forEach(s => {
    s.onclick = () => s.classList.toggle("closed");
  });
  $("#panel").querySelectorAll("[data-cfg]").forEach(l => {
    l.onclick = e => {
      if (e.target.tagName === "INPUT") e.preventDefault();
      g.pick = Number(l.dataset.cfg);
      refresh();
    };
  });
  if (cmdOpen) showCmd();
}

function highlight() {
  document.querySelectorAll(".tile").forEach(t =>
    t.classList.toggle("sel", Number(t.dataset.i) === sel));
  const t = grid.querySelector('.tile[data-i="' + sel + '"]');
  if (t) t.scrollIntoView({ block: "nearest" });
  renderPanel();
}

// Repaint tiles so switching config updates the caption.
function refresh() {
  shown.forEach(paintTile);
  highlight();
}

async function launch(i) {
  const g = GROUPS[i];
  if (!g) return;
  const idx = cfg(g).index;
  const btn = $("#pgo");
  if (btn) { btn.classList.add("busy"); btn.textContent = "Starting"; btn.disabled = true; }
  try {
    const r = await fetch("/api/launch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index: idx })      // integer index only, by design
    });
    const j = await r.json();
    toast(r.ok ? "Launched: " + j.label : "Failed: " + (j.error || "?"), !r.ok);
  } catch (e) {
    toast("Failed: " + e, true);
  }
  if (btn) { btn.classList.remove("busy"); btn.textContent = "Play"; btn.disabled = false; }
}

async function showCmd() {
  const el = $("#pcmdout");
  if (!el) return;
  if (el.classList.contains("show")) { el.classList.remove("show"); cmdOpen = false; return; }
  const r = await fetch("/api/dryrun?i=" + cfg(GROUPS[sel]).index);
  const j = await r.json();
  el.textContent = j.command || j.error;
  el.classList.add("show");
  cmdOpen = true;
}

grid.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (t) { sel = Number(t.dataset.i); cmdOpen = false; highlight(); }
});

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

$("#q").addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  e.preventDefault(); e.stopPropagation();
  $("#q").value = ""; render(); $("#q").blur();
}, true);

$("#q").addEventListener("input", () => render(true));

const typing = () => document.activeElement === $("#q");
const NAV = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "d", "D", "/"]);

document.addEventListener("keydown", e => {
  if (typing() && !NAV.has(e.key)) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape") {
    $("#q").value = ""; render(); $("#q").blur(); e.preventDefault(); return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    if (typing()) { $("#q").blur(); return; }
    if (shown.length) launch(sel);
    return;
  }
  if (e.key.toLowerCase() === "d") { showCmd(); return; }
  const g = GROUPS[sel];
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    // Move between a game's configurations without leaving the tile.
    if (!g || g.cfgs.length < 2) return;
    e.preventDefault();
    g.pick = (g.pick + (e.key === "ArrowRight" ? 1 : -1) + g.cfgs.length) % g.cfgs.length;
    refresh();
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!shown.length) return;
    const at = shown.indexOf(sel);
    sel = shown[Math.max(0, Math.min(shown.length - 1,
      at + (e.key === "ArrowDown" ? 1 : -1)))];
    cmdOpen = false;
    highlight();
  }
});

fetch("/api/entries").then(r => r.json()).then(d => {
  ENTRIES = d.entries.map((e, i) => Object.assign({ __i: i }, e));
  GROUPS = groupEntries(ENTRIES);
  const multi = GROUPS.filter(g => g.cfgs.length > 1).length;
  $("#count").textContent = GROUPS.length + " games" +
    (multi ? " \u00b7 " + multi + " with configs" : "");
  $("#packname").textContent = d.pack;
  if (d.missing && d.missing.length) {
    $("#warn").innerHTML = '<div class="warn">' + d.missing.length +
      " source file(s) missing: " + esc(d.missing.join("; ")) + "</div>";
  }
  render();
});
</script>
</body>
</html>
